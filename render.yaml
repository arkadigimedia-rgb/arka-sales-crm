databases:
  - name: arka-sales-db
    databaseName: arka_sales
    user: arka_user
    plan: free

services:
  - type: web
    name: arka-sales-crm
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: pnpm db:migrate && pnpm db:seed:users && pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arka-sales-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
