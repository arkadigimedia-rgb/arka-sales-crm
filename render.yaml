databases:
  - name: arka-sales-db
    databaseName: arka_sales
    user: arka_user
    plan: free

services:
  - type: web
    name: arka-sales-crm
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --prod=false && pnpm build
    startCommand: node scripts/start.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arka-sales-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN
        value: "false"
